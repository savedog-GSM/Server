# 테스트는 MySQL이나 .env 없이 H2 인메모리 DB로 돈다.
spring.datasource.url=jdbc:h2:mem:savedog-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# 테스트는 물체 인식 모델 없이 돈다. 실제 모델 확인은 OnnxYoloDetectorTest가 한다.
savedog.vision.model-path=
