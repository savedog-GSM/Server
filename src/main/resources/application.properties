spring.application.name=savedog
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

spring.h2.console.enabled=false

savedog.security.device-token=${DEVICE_API_TOKEN:}
savedog.security.operator-token=${OPERATOR_API_TOKEN:}

savedog.cors.allowed-origins=${CORS_ALLOWED_ORIGIN}

savedog.s3.bucket=${S3_BUCKET}
savedog.s3.region=${AWS_REGION}

savedog.kakao.rest-api-key=${KAKAO_REST_API_KEY}
