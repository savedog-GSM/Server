spring.application.name=savedog
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.error.include-stacktrace=never

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

savedog.security.device-token=${DEVICE_API_TOKEN:}
savedog.security.operator-token=${OPERATOR_API_TOKEN:}

savedog.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:5173}

savedog.s3.bucket=${S3_BUCKET:}
savedog.s3.region=${AWS_REGION:ap-northeast-2}

savedog.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
