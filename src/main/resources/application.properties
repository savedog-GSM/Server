spring.application.name=savedog
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# 켜 두면 트랜잭션이 끝나도 요청이 끝날 때까지 DB 연결을 붙잡는다.
# 신고 제출이 민원 창구를 기다리는 동안 연결을 놓아야 하므로 끈다. (이슈 #6)
spring.jpa.open-in-view=false

server.error.include-stacktrace=never

spring.h2.console.enabled=false

# 아래 값들은 환경 변수가 없어도 서버가 뜨도록 기본값을 둔다. (DB 접속 정보만 필수)
# 토큰을 비워 두면 그쪽은 검사하지 않는다(개발용).
savedog.security.device-token=${DEVICE_API_TOKEN:}
savedog.security.operator-token=${OPERATOR_API_TOKEN:}

# 허용할 프론트엔드 출처(쉼표로 구분)
savedog.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:5173}

# 버킷을 비워 두면 이미지 기능만 꺼진다.
savedog.s3.bucket=${S3_BUCKET:}
savedog.s3.region=${AWS_REGION:ap-northeast-2}

# 비워 두면 신고의 주소가 비어 있다.
savedog.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
