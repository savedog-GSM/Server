spring.application.name=savedog
server.port=8080

# 로컬에서 직접 실행하면 프로젝트 루트의 git-ignored .env도 읽는다. Docker Compose는 env_file로 전달한다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.error.include-stacktrace=never

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

savedog.security.device-token=${DEVICE_API_TOKEN:}
savedog.security.operator-token=${OPERATOR_API_TOKEN:}

savedog.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://localhost:5173}

# S3 설정. 키는 .env/환경 변수로만 제공하고 소스에는 저장하지 않는다.
savedog.s3.bucket=${S3_BUCKET:}
savedog.s3.region=${AWS_REGION:ap-northeast-2}
savedog.s3.access-key=${AWS_ACCESS_KEY_ID:}
savedog.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
savedog.s3.session-token=${AWS_SESSION_TOKEN:}

savedog.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

savedog.vision.model-path=${VISION_MODEL_PATH:models/yolox_tiny.onnx}

savedog.report.mock-authority=${REPORT_MOCK_AUTHORITY:false}
