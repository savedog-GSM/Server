name: CD

on:
  push:
    branch:
      - main
      - feat/pathfinding
  workflows_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          username: ubuntu
          host: ${{ secrets.SERVER_HOST }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/Server
            sudo docker compose down
            sudo docker compose up -d --build